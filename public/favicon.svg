<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Alumère">
  <!-- The ∑ tile of the topbar, drawn instead of typed: a text glyph favicon depends on a
       font the browser may not have, a path always renders the same. Colours are the accent
       and lilac custom properties of styles.css; corner radius 25%, as .logo (7px on 28px).
       Careful editing this: a double hyphen is illegal inside an XML comment and the whole
       file stops parsing — the icon then fails silently, with no console error. -->
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7eb0d5"/>
      <stop offset="1" stop-color="#bd7ebe"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#a)"/>
  <path d="M46 18 H19 L34 32 L19 46 H46" fill="none" stroke="#fff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
